name: Build Torchlight2SharedStashManager

# 触发条件：push到任意分支（本地git push，或者GitHub网页在线编辑保存都会触发）
on:
  push:
    # 所有分支都触发，如果你只想main分支触发，改成 branches: [ main ]
    branches: [ '*' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Qt5 5.15.2 MinGW64
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtbase qtsvg qtsql qtwidgets'
          cache: true

      - name: Build with qmake
        run: |
          qmake Torchlight2SharedStashManager.pro
          mingw32-make -j4

      - name: Deploy Qt dependencies
        run: |
          cd release
          windeployqt Torchlight2SharedStashManager.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Torchlight2-StashManager-Win64
          path: release/
